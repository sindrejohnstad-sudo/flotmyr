<!DOCTYPE html>

<html lang="no">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Er det fortsatt et stort hull på Flotmyr?</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>ER DET FORTSATT ET STORT HULL PÅ FLOTMYR?</h1>

    <h2 id="flotmyr-svar">JA.</h2>
  <p id="sist-sjekket"></p>

   
<script>
    const now = new Date();

    const dato = now.toLocaleDateString('no-NO');
    const klokkeslett = now.toLocaleTimeString('no-NO', {
        hour: '2-digit',
        minute: '2-digit'
    });

    document.getElementById('sist-sjekket').textContent =
        `Sist sjekket: ${dato} kl. ${klokkeslett}`;
</script>
<script>

  const svaralternativer = [

    "JA.",

    "JEPP.",

    "YES.",

    "YUP.",

    "ÅJA.",

    "ABSOLUTT.",

    "SELVFØLGELIG.",

    "UTEN TVIL.",

    "100 %.",

    "OH YES.",

    "SÌ.",

    "OUI.",

    "JA, FOR HULLVETE.",

    "SJOKKERENDE NOK, JA.",

    "TRO DET ELLER EI.",

    "GJETT ÉN GANG.",

    "INTET NYTT.",

    "JA, DYPT ER DET OGSÅ.",

    "DESSVERRE.",

    "SELVFØLGELIG ER DET DET.",

    "HVORFOR SKULLE DET IKKE VÆRE DET?",

    "IKKE HOLD PUSTEN.",

    "HULL YEAH!",

    "JA, SÅ DET HOLDER.",

    "JA, GANSKE STORT OGSÅ.",

    "JA, FAKTISK.",

    "JA, OG VEL SÅ DET.",

    "JA, HEILT HÅL I HÅVE.",

    "JA, DET GÅR BARE NEDOVER.",

    "JA, SJØLSAGT.",

    "JA, SOM VANLIG.",

    "JA, DET MÅ DU NOK REGNA MED.",

    "PER DEFINISJON, JA.",

    "ETTER ALLE SOLEMERKER.",

    "SOM FORVENTET.",

    "JAUDA.",

    "JA, KA TRUDDE DU?",

    "JA, DET SKA EG LOVA DEG.",

    "JA, DET KAN DU BANNA PÅ.",

    "JA, DET E NÅ SÅ."

  ];

  // Hent forrige svar

  let forrigeSvar = null;

  try {

    forrigeSvar = localStorage.getItem("flotmyrForrigeSvar");

  } catch (e) {}

  // Fjern forrige svar fra trekningen

  const muligeSvar = svaralternativer.filter(

    svar => svar !== forrigeSvar

  );

  // Velg tilfeldig svar

  const tilfeldigSvar = muligeSvar[

    Math.floor(Math.random() * muligeSvar.length)

  ];

  // Vis svaret

 // Vis svaret

const svarElement = document.getElementById("flotmyr-svar");

svarElement.textContent = tilfeldigSvar;

// Tilpass skriftstørrelsen automatisk

function tilpassSkriftstorrelse() {

  const maksBredde = document.documentElement.clientWidth * 0.9;

  // Start med stor skrift

  let storrelse = Math.min(window.innerWidth * 0.3, 450);

  svarElement.style.fontSize = storrelse + "px";

  // Mål tekstens faktiske bredde

  const maler = document.createElement("span");

  const stil = window.getComputedStyle(svarElement);

  maler.style.font = stil.font;

  maler.style.letterSpacing = stil.letterSpacing;

  maler.style.whiteSpace = "nowrap";

  maler.style.position = "fixed";

  maler.style.visibility = "hidden";

  maler.textContent = svarElement.textContent;

  document.body.appendChild(maler);

  const tekstBredde = maler.getBoundingClientRect().width;

  maler.remove();

  // Reduser skriftstørrelsen hvis teksten er for bred

  if (tekstBredde > maksBredde) {

    storrelse = storrelse * (maksBredde / tekstBredde);

    svarElement.style.fontSize = storrelse + "px";

  }

}

// Tilpass ved innlasting

tilpassSkriftstorrelse();

// Tilpass hvis nettleservinduet endrer størrelse

window.addEventListener("resize", tilpassSkriftstorrelse);

  // Husk svaret til neste gang

  try {

    localStorage.setItem("flotmyrForrigeSvar", tilfeldigSvar);

  } catch (e) {}

</script>
</body>

</html>
